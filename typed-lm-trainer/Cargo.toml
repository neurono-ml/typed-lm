[package]
name = "typed-lm-trainer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "typed-lm-trainer"
path = "src/main.rs"

[dependencies]
typed-lm-common = { path = "../typed-lm-common" }
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
half.workspace = true
hf-hub.workspace = true
tokenizers.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror = "2"
tokio.workspace = true

[features]
default = []
cuda = ["candle-transformers/cuda"]
cudnn = ["candle-transformers/cudnn"]
flash-attn = ["candle-transformers/flash-attn"]
metal = ["candle-transformers/metal"]
mkl = ["candle-transformers/mkl"]

[dev-dependencies]
tempfile.workspace = true
