# Configuration for git-cliff, used by the release workflow to build the
# release notes from the commits since the previous release.
#
# Conventional Commit prefixes in this repository (`feat:`, `fix:`, ...) are
# grouped; any other message lands under "Other Changes".

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Tests" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Miscellaneous" },
    { message = ".*", group = "Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v?[0-9]*\\.[0-9]*\\.[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
