[package]
name = "typed-lm-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Jev-compatible, single-forward-pass semantic routing server for dense decoder models, built on Candle."
documentation = "https://neurono-ml.github.io/typed-lm/"
readme = "README.md"
keywords = ["llm", "inference", "actix-web", "candle", "server"]
categories = ["web-programming", "science", "artificial-intelligence"]

[[bin]]
name = "typed-lm-serve"
path = "src/main.rs"

[dependencies]
typed-lm-common = { path = "../typed-lm-common", version = "0.1.0" }
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
half.workspace = true
hf-hub.workspace = true
tokenizers.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
actix-web.workspace = true
rig-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tokio.workspace = true
thiserror = "2"

[features]
default = []
# Accelerators. None of these are enabled by default so the crate always
# builds on a machine without a CUDA/Metal toolchain. Enable at build time:
#   cargo build --release --features cuda
cuda = ["candle-transformers/cuda"]
cudnn = ["candle-transformers/cudnn"]
flash-attn = ["candle-transformers/flash-attn"]
metal = ["candle-transformers/metal"]
# CPU acceleration (Intel MKL). Also useful on x86 hosts without a GPU.
mkl = ["candle-transformers/mkl"]

[dev-dependencies]
tempfile.workspace = true
ahash.workspace = true
