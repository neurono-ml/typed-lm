[package]
name = "manaca-typed"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
half = "2"
hf-hub = "0.4"
tokenizers = "0.19.1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4"
rig-core = "0.42"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Accelerators. None of these are enabled by default so the crate always
# builds on a machine without a CUDA/Metal toolchain. Enable at build time:
#   cargo build --release --features cuda
cuda = ["candle-transformers/cuda"]
cudnn = ["candle-transformers/cudnn"]
flash-attn = ["candle-transformers/flash-attn"]
metal = ["candle-transformers/metal"]
# CPU acceleration (Intel MKL). Also useful on x86 hosts without a GPU.
mkl = ["candle-transformers/mkl"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
# Candle inference is unusable at opt-level 0. Keep debug symbols but make the
# local development builds actually usable.
opt-level = 2
