[workspace]
resolver = "2"
members = [
    "typed-lm-common",
    "typed-lm-serve",
    "typed-lm-trainer",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/neurono-ml/typed-lm"
homepage = "https://github.com/neurono-ml/typed-lm"
authors = ["neurono-ml"]

[workspace.dependencies]
anyhow = "1.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
half = "2"
hf-hub = { version = "1", features = ["blocking"] }
tokenizers = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
actix-web = "4"
rig-core = "0.42"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
ahash = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
# Candle inference is unusable at opt-level 0. Keep debug symbols but make the
# local development builds actually usable.
opt-level = 2
