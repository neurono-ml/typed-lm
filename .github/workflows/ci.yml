name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Drop host-specific CPU tuning
        run: rm -f .cargo/config.toml

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      # The GPU/network live tests stay excluded, but the FP8/FP4 artifact
      # round-trips are network-free and run here.
      - name: Network-free ignored tests
        run: cargo test -p typed-lm-serve --test loads_trainer_artifact -- --ignored
