name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # 1. Blocking gate: nothing is released or published before the tests pass.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Drop host-specific CPU tuning
        run: rm -f .cargo/config.toml

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: Network-free ignored tests
        run: cargo test -p typed-lm-serve --test loads_trainer_artifact -- --ignored

  # 2. Resolve the workspace version and create the tagged release with
  #    release notes generated from the commits since the previous release.
  release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the workspace version
        id: version
        run: |
          version="$(grep -m1 -A30 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve workspace.package.version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Validate the pushed tag matches the workspace version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "$VERSION" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag '$REF_NAME' does not match workspace version '$VERSION'"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Generate the release notes from the commits
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            git-cliff --config cliff.toml --current --output RELEASE_NOTES.md
          else
            git-cliff --config cliff.toml --unreleased --tag "$VERSION" --output RELEASE_NOTES.md
          fi

      - name: Create the release with the generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; reusing it."
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            gh release create "$TAG" \
              --title "typed-lm $VERSION" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "typed-lm $VERSION" \
              --notes-file RELEASE_NOTES.md
          fi

  # 3. Build stage: prebuilt binaries for every host we can cover on
  #    GitHub-hosted runners, uploaded to the GitHub release.
  build-cpu:
    name: Build (linux x86_64, cpu)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Drop host-specific CPU tuning
        run: rm -f .cargo/config.toml

      - name: Build the binaries
        run: cargo build --release -p typed-lm-serve -p typed-lm-trainer

      - name: Package the release archive
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          staging="typed-lm-${VERSION}-linux-x86_64-cpu"
          mkdir -p "dist/${staging}"
          cp target/release/typed-lm-serve "dist/${staging}/"
          cp target/release/typed-lm-trainer "dist/${staging}/"
          cp README.md LICENSE "dist/${staging}/"
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"
          rm -rf "dist/${staging}"
          (cd dist && sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256")

      - name: Upload the binaries for the container build
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-binaries
          path: |
            target/release/typed-lm-serve
            target/release/typed-lm-trainer

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  build-metal:
    name: Build (macos arm64, metal)
    needs: release
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Drop host-specific CPU tuning
        run: rm -f .cargo/config.toml

      - name: Build the binaries
        run: cargo build --release -p typed-lm-serve -p typed-lm-trainer --features metal

      - name: Package the release archive
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          staging="typed-lm-${VERSION}-macos-aarch64-metal"
          mkdir -p "dist/${staging}"
          cp target/release/typed-lm-serve "dist/${staging}/"
          cp target/release/typed-lm-trainer "dist/${staging}/"
          cp README.md LICENSE "dist/${staging}/"
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"
          rm -rf "dist/${staging}"
          (cd dist && shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256")

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  # CUDA binaries are best effort: GitHub-hosted runners have no GPU and the
  # CUDA kernel build is heavy. A failure here does not block publication,
  # because `cargo install --features cuda` from crates.io always provides the
  # CUDA build.
  build-cuda:
    name: Build (linux x86_64, cuda)
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.2'
          method: local

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Drop host-specific CPU tuning
        run: rm -f .cargo/config.toml

      - name: Build the CUDA binaries
        env:
          CUDA_COMPUTE_CAP: '80'
        run: cargo build --release -p typed-lm-serve -p typed-lm-trainer --features cuda

      - name: Package the release archive
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          staging="typed-lm-${VERSION}-linux-x86_64-cuda"
          mkdir -p "dist/${staging}"
          cp target/release/typed-lm-serve "dist/${staging}/"
          cp target/release/typed-lm-trainer "dist/${staging}/"
          cp README.md LICENSE "dist/${staging}/"
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"
          rm -rf "dist/${staging}"
          (cd dist && sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256")

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  # Container images for the binaries, published to the GitHub Container
  # Registry. Built from the prebuilt CPU binaries so the image build does not
  # recompile the whole dependency tree.
  docker:
    name: Publish container images
    needs: [release, build-cpu]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the CPU binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-cpu-binaries
          path: dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push typed-lm-serve
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve-binary
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/typed-lm-serve:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/typed-lm-serve:${{ needs.release.outputs.version }}

      - name: Build and push typed-lm-trainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.trainer-binary
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/typed-lm-trainer:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/typed-lm-trainer:${{ needs.release.outputs.version }}

  # 4. Publish stage: crates.io. `typed-lm-common` goes first, then the two
  #    binaries wait for the index to expose it before publishing.
  publish-crates:
    name: Publish to crates.io
    needs: [release, build-cpu, build-metal, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          already_published() {
            local name="$1" version="$2"
            local status
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: typed-lm-release' \
              "https://crates.io/api/v1/crates/${name}/${version}")"
            [ "$status" = "200" ]
          }

          publish() {
            local name="$1"
            if already_published "$name" "$VERSION"; then
              echo "::notice::${name} ${VERSION} is already on crates.io; skipping."
              return 0
            fi
            echo "Publishing ${name} ${VERSION}..."
            local attempt
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$name" --no-verify --allow-dirty; then
                return 0
              fi
              echo "::warning::publish of ${name} failed on attempt ${attempt}; retrying in 15s"
              sleep 15
            done
            echo "::error::failed to publish ${name} ${VERSION}"
            return 1
          }

          wait_for_index() {
            local name="$1"
            for _ in $(seq 1 60); do
              if already_published "$name" "$VERSION"; then
                return 0
              fi
              sleep 10
            done
            echo "::error::${name} ${VERSION} did not appear on crates.io in time"
            return 1
          }

          publish typed-lm-common
          wait_for_index typed-lm-common
          publish typed-lm-serve
          publish typed-lm-trainer
